name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GitHub Pages sirve los proyectos en https://usuario.github.io/nombre-repo/,
      # así que hay que compilar los assets con esa ruta como prefijo (ver
      # app.config.js). Si en su lugar usas un dominio propio o Pages "de
      # usuario" (usuario.github.io a secas), pon aquí EXPO_PUBLIC_BASE_PATH: "".
      - run: npm run build:web
        env:
          EXPO_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
